     like /a/b/c. Relative links to style.css would break there, so the styles
     are inline and the link points at the site root. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 0 1.25rem;
    background: #0e1417;
    color: #eef4f4;
    font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; letter-spacing: -0.04em; }
  p { margin: 1rem 0 2rem; color: #9fb0b4; }
  a {
    display: inline-block;
    padding: 0.6rem 1.15rem;
    border-radius: 10px;
    background: #4fd1bf;
    color: #062420;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #6fe0d0; }
  a:focus-visible { outline: 2px solid #eef4f4; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
