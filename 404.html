<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Sebastian Scheibler</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this file for any missing path, including nested ones
     like /a/b/c. Relative links to style.css would break there, so the styles
     are inline and the link points at the site root. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 0 1.25rem;
    background:
      radial-gradient(36rem 24rem at 85% 0%, rgb(168 85 247 / 0.40), transparent 65%),
      radial-gradient(30rem 20rem at 10% 100%, rgb(236 72 153 / 0.25), transparent 65%),
      #0f0a1f;
    color: #f3effa;
    font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; letter-spacing: -0.04em; }
  p { margin: 1rem 0 2rem; color: #b4a9c9; }
  a {
    display: inline-block;
    padding: 0.6rem 1.15rem;
    border-radius: 10px;
    background: #7c3aed;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #8b5cf6; }
  a:focus-visible { outline: 2px solid #f3effa; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
